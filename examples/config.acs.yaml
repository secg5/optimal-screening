dataset:
  class: acs_income.ACSDataset
  csv_path: data/acs_income_sample.csv
  treatment_col: RAC1P
  outcome_col: "PINCP > 50k"
  # Common ACS features for income modeling; exclude PINCP from prompt
  variables: [AGEP, SEX, RAC1P, SCHL, MAR, WKHP, ESR, COW]

model:
  type: openai
  model_name: gpt-4.1-mini
  params:
    temperature: 0
    max_tokens: 256

run:
  output_dir: runs
