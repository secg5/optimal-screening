dataset:
  class: generic.GenericCSVDataset
  csv_path: data/sample.csv
  treatment_col: feature_a
  outcome_col: target
  variables: [feature_a, feature_b, target]

model:
  type: openai        # openai | bedrock | local
  model_name: gpt-4.1-mini
  params:
    temperature: 0
    max_tokens: 256

run:
  output_dir: runs
