[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
ignore = [
    "B028", # warning without explicit stacklevel
    "C408", # dict() calls (stylistic)
    "C901", # function complexity
    "E501",
]
extend-select = ["E", "F", "I", "W", "UP", "B", "T", "C"]

[tool.ruff.lint.per-file-ignores]
# Ignore import violations in all `__init__.py` files.
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2
[project]
name = "optimal-screening"
version = "0.1.0"
description = "LLM-driven screening probability estimation for treatment effectiveness"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Contributors" }
]
dependencies = [
  "PyYAML==6.0.3",
  "python-dotenv==1.1.1",
  "openai==2.6.0",
  "boto3==1.40.55",
  "vllm==0.11.0",
]


[project.urls]
Homepage = "https://github.com/"
